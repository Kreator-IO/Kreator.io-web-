<svg width="1600" height="520" viewBox="0 0 1600 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kreonix.io chrome orbital cube logo</title>
  <desc id="desc">A floating metallic cube with a chrome orbit ring, cyan neon base glow, and spaced chrome Kreonix.io lettering.</desc>
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(358 226) rotate(90) scale(162 288)">
      <stop stop-color="#dff4ff" stop-opacity=".46"/>
      <stop offset=".45" stop-color="#7dd3fc" stop-opacity=".18"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="blueGlow" x="-35%" y="-60%" width="170%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 .02 0 0 0 0 .72 0 0 0 0 1 0 0 0 .75 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020617" flood-opacity=".64"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#dff4ff" flood-opacity=".32"/>
    </filter>
    <linearGradient id="chrome" x1="225" y1="90" x2="480" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset=".18" stop-color="#dce8f4"/>
      <stop offset=".46" stop-color="#74879c"/>
      <stop offset=".66" stop-color="#f8fcff"/>
      <stop offset="1" stop-color="#7f8fa2"/>
    </linearGradient>
    <linearGradient id="darkFace" x1="216" y1="189" x2="374" y2="406" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4e4f1"/>
      <stop offset=".24" stop-color="#1b3042"/>
      <stop offset="1" stop-color="#020711"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="360" y1="178" x2="505" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef8ff"/>
      <stop offset=".34" stop-color="#415468"/>
      <stop offset="1" stop-color="#020916"/>
    </linearGradient>
    <linearGradient id="ring" x1="62" y1="184" x2="644" y2="297" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06101b"/>
      <stop offset=".16" stop-color="#f3fbff"/>
      <stop offset=".44" stop-color="#435768"/>
      <stop offset=".78" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#06101b"/>
    </linearGradient>
    <linearGradient id="cyanArc" x1="162" y1="331" x2="550" y2="331" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02c7ff" stop-opacity="0"/>
      <stop offset=".16" stop-color="#46e8ff"/>
      <stop offset=".5" stop-color="#c6fbff"/>
      <stop offset=".84" stop-color="#37ddff"/>
      <stop offset="1" stop-color="#02c7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wordChrome" x1="702" y1="184" x2="1426" y2="333" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#d8e2ee"/>
      <stop offset=".5" stop-color="#7d8da1"/>
      <stop offset=".72" stop-color="#f9fdff"/>
      <stop offset="1" stop-color="#8a99aa"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" fill="transparent"/>
  <g filter="url(#softShadow)">
    <ellipse cx="354" cy="249" rx="296" ry="132" fill="url(#ambient)"/>
    <ellipse cx="354" cy="244" rx="292" ry="83" stroke="url(#ring)" stroke-width="18" opacity=".96"/>
    <ellipse cx="354" cy="244" rx="262" ry="69" stroke="#06101b" stroke-width="8" opacity=".62"/>
    <g filter="url(#blueGlow)">
      <path d="M168 330c45 64 326 64 374 0" stroke="url(#cyanArc)" stroke-width="21" stroke-linecap="round"/>
      <path d="M192 335c67 34 254 35 326 0" stroke="#8cf5ff" stroke-width="5" stroke-linecap="round" opacity=".94"/>
      <path d="M354 358v26" stroke="#c8fbff" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    </g>
    <path d="M354 84 486 160.5v153L354 390 222 313.5v-153L354 84Z" fill="#010712"/>
    <path d="M354 84 486 160.5 354 237 222 160.5 354 84Z" fill="url(#chrome)"/>
    <path d="M486 160.5v153L354 390V237l132-76.5Z" fill="url(#rightFace)"/>
    <path d="M222 160.5v153L354 390V237l-132-76.5Z" fill="url(#darkFace)"/>
    <path d="M354 84v153M222 160.5 354 237l132-76.5M354 237v153" stroke="#ecf9ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
    <path d="m261 183 93 53.5 93-53.5" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".78"/>
    <path d="m485 161-131 78" stroke="#020711" stroke-width="20" stroke-linecap="round" opacity=".9"/>
    <path d="m223 161 131 78" stroke="#020711" stroke-width="16" stroke-linecap="round" opacity=".82"/>
    <path d="M354 101 470 168" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".62"/>
  </g>
  <g filter="url(#blueGlow)">
    <text x="700" y="295" fill="url(#wordChrome)" font-family="Inter, Sora, Orbitron, Arial, sans-serif" font-size="118" font-weight="800" letter-spacing="28">KREONIX</text>
    <text x="1325" y="295" fill="url(#wordChrome)" font-family="Inter, Sora, Orbitron, Arial, sans-serif" font-size="103" font-weight="800" letter-spacing="16">.IO</text>
    <path d="M704 326h540" stroke="#dbeafe" stroke-width="2" stroke-linecap="round" opacity=".36"/>
    <path d="M1282 326h152" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity=".56"/>
  </g>
</svg>
