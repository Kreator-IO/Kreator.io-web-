<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kreonix orbital cube favicon</title>
  <desc id="desc">A floating chrome cube with a metallic orbital ring and cyan neon glow.</desc>
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 252) rotate(90) scale(168 226)">
      <stop stop-color="#dff4ff" stop-opacity=".5"/><stop offset=".46" stop-color="#7dd3fc" stop-opacity=".2"/><stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-45%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 .02 0 0 0 0 .72 0 0 0 0 1 0 0 0 .72 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <linearGradient id="chrome" x1="138" y1="98" x2="376" y2="378" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/><stop offset=".18" stop-color="#dce8f4"/><stop offset=".46" stop-color="#74879c"/><stop offset=".66" stop-color="#f8fcff"/><stop offset="1" stop-color="#7f8fa2"/>
    </linearGradient>
    <linearGradient id="darkFace" x1="130" y1="198" x2="278" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4e4f1"/><stop offset=".24" stop-color="#1b3042"/><stop offset="1" stop-color="#020711"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="258" y1="190" x2="394" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef8ff"/><stop offset=".34" stop-color="#415468"/><stop offset="1" stop-color="#020916"/>
    </linearGradient>
    <linearGradient id="ring" x1="30" y1="206" x2="482" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06101b"/><stop offset=".16" stop-color="#f3fbff"/><stop offset=".44" stop-color="#435768"/><stop offset=".78" stop-color="#ffffff"/><stop offset="1" stop-color="#06101b"/>
    </linearGradient>
    <linearGradient id="cyanArc" x1="88" y1="342" x2="424" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02c7ff" stop-opacity="0"/><stop offset=".16" stop-color="#46e8ff"/><stop offset=".5" stop-color="#c6fbff"/><stop offset=".84" stop-color="#37ddff"/><stop offset="1" stop-color="#02c7ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="256" cy="252" rx="236" ry="164" fill="url(#ambient)"/>
  <g filter="url(#glow)">
    <ellipse cx="256" cy="246" rx="224" ry="70" stroke="url(#ring)" stroke-width="18" opacity=".96"/>
    <ellipse cx="256" cy="246" rx="198" ry="56" stroke="#06101b" stroke-width="8" opacity=".58"/>
    <path d="M96 340c38 56 282 56 320 0" stroke="url(#cyanArc)" stroke-width="20" stroke-linecap="round"/>
    <path d="M116 346c58 28 222 29 280 0" stroke="#8cf5ff" stroke-width="5" stroke-linecap="round" opacity=".94"/>
    <path d="M256 102 376 171.5v139L256 380 136 310.5v-139L256 102Z" fill="#010712"/>
    <path d="M256 102 376 171.5 256 241 136 171.5 256 102Z" fill="url(#chrome)"/>
    <path d="M376 171.5v139L256 380V241l120-69.5Z" fill="url(#rightFace)"/>
    <path d="M136 171.5v139L256 380V241l-120-69.5Z" fill="url(#darkFace)"/>
    <path d="M256 102v139M136 171.5 256 241l120-69.5M256 241v139" stroke="#ecf9ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".72"/>
    <path d="m171 192 85 49 85-49" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".78"/>
    <path d="m375 172-119 71" stroke="#020711" stroke-width="19" stroke-linecap="round" opacity=".9"/>
    <path d="m137 172 119 71" stroke="#020711" stroke-width="15" stroke-linecap="round" opacity=".82"/>
    <path d="M256 118 362 179" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".62"/>
